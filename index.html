<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>McHenry Honor Board</title>

<style>
  body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }

  .board-container {
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
  }

  .header-logos {
    text-align: center;
    padding: 20px 0;
  }

  .mchenry-logo {
    height: 150px;
    background: white;
    padding: 12px 24px;
    border-radius: 10px;
  }

  .content-area {
    display: flex;
    height: 720px;
    padding: 0 20px;
    gap: 20px;
    box-sizing: border-box;
  }

  .column {
    width: 50%;
    position: relative;
    overflow: hidden;
  }

  .category-title {
    font-size: 36px;
    font-weight: bold;
    text-align: center;
    background: #b30000;
    padding: 14px 0;
    border-radius: 6px;
    color: white;
    box-shadow: 0 0 12px rgba(0,0,0,0.6);
    width: 100%;
  }

  .scroll-box {
    position: absolute;
    top: 80px;
    bottom: 0;
    width: 100%;
    overflow: hidden;
  }

  .scroll-content {
    display: flex;
    flex-direction: column;
    width: 100%;
    position: relative;
  }

  .entry {
    display: flex;
    justify-content: space-between;
    padding: 6px 12px;
    font-size: 28px;
  }

  .entry-name {
    text-align: left;
    flex: 1;
  }

  .entry-score {
    text-align: right;
    white-space: nowrap;
  }

  .separator {
    font-size: 24px;
    text-align: center;
    opacity: 0.6;
    margin: 10px 0;
  }

  @keyframes scroll-up {
    from { transform: translateY(100%); }
    to   { transform: translateY(-100%); }
  }
</style>
</head>

<body>

<div class="board-container">

  <div class="header-logos">
    <img class="mchenry-logo" src="mchenry-logo.png">
  </div>

  <div class="content-area">

    <!-- 300 Games -->
    <div class="column">
      <div class="category-title">300 Games</div>
      <div class="scroll-box">
        <div class="scroll-content" id="scroll-300">
          <div id="cat-300"></div>
          <div id="cat-300-dup"></div>
        </div>
      </div>
    </div>

    <!-- 800 Series -->
    <div class="column">
      <div class="category-title">800 Series</div>
      <div class="scroll-box">
        <div class="scroll-content" id="scroll-800">
          <div id="cat-800"></div>
          <div id="cat-800-dup"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
  const URL_300 = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTo4pC3erQX6RWtulE08AgfjpGAeCgG4QCB1JvM005F21JrpD1IIdpE1axoNQN19pJDqGICriWnvcUA/pub?gid=0&single=true&output=csv";
  const URL_800 = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTo4pC3erQX6RWtulE08AgfjpGAeCgG4QCB1JvM005F21JrpD1IIdpE1axoNQN19pJDqGICriWnvcUA/pub?gid=288383571&single=true&output=csv";

  async function fetchCsv(url) {
    const res = await fetch(url, {
      method: "GET",
      mode: "cors",
      headers: {
        "Content-Type": "text/csv"
      }
    });

    const text = await res.text();
    return text.trim().split(/\r?\n/).map(line => line.split(","));
  }

  function addBlankLines(container, count = 30) {
    for (let i = 0; i < count; i++) {
      const div = document.createElement("div");
      div.className = "entry";
      div.innerHTML = "&nbsp;";
      container.appendChild(div);
    }
  }

  function addSeparator(container) {
    const sep = document.createElement("div");
    sep.className = "separator";
    sep.textContent = "------------------------------";
    container.appendChild(sep);
  }

  function renderList(rows, container, formatter) {
    const header = rows[0];
    const data = rows.slice(1);

    container.innerHTML = "";

    data.forEach(r => {
      const div = document.createElement("div");
      div.className = "entry";
      div.innerHTML = formatter(r, header);
      container.appendChild(div);
    });

    addBlankLines(container);
    addSeparator(container);
  }

  function startScroll(id, duration) {
    const content = document.getElementById(id);
    setTimeout(() => {
      content.style.animation = `scroll-up ${duration}s linear infinite`;
    }, 1000);
  }

  window.addEventListener("load", async () => {
    const [rows300, rows800] = await Promise.all([
      fetchCsv(URL_300),
      fetchCsv(URL_800)
    ]);

    const c300 = document.getElementById("cat-300");
    const c800 = document.getElementById("cat-800");

    renderList(rows300, c300, (r,h)=>{
      const first = r[h.indexOf("FirstName")];
      const last  = r[h.indexOf("LastName")];
      const count = Number(r[h.indexOf("Count")]);
      return `
        <span class="entry-name">${first} ${last}</span>
        <span class="entry-score">${count > 1 ? "(" + count + ")" : ""}</span>
      `;
    });

    renderList(rows800, c800, (r,h)=>{
      return `
        <span class="entry-name">${r[h.indexOf("FirstName")]} ${r[h.indexOf("LastName")]}</span>
        <span class="entry-score">${r[h.indexOf("Score")]}</span>
      `;
    });

    document.getElementById("cat-300-dup").innerHTML = c300.innerHTML;
    document.getElementById("cat-800-dup").innerHTML = c800.innerHTML;

    startScroll("scroll-300", 40);
    startScroll("scroll-800", 40);
  });
</script>

</body>
</html>
