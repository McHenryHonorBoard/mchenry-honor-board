<!DOCTYPE html>
<html>
<head>
<style>
.scroll-window {
    height: 200px;
    overflow: hidden;
    border: 2px solid red;
}

.scroll-content {
    animation: scrollUp 5s linear infinite;
}

@keyframes scrollUp {
    0% { transform: translateY(0); }
    100% { transform: translateY(-100%); }
}
</style>
</head>

<body>

<div class="scroll-window">
    <div class="scroll-content">
        <div>Line 1</div>
        <div>Line 2</div>
        <div>Line 3</div>
        <div>Line 4</div>
        <div>Line 5</div>
        <div>Line 6</div>
        <div>Line 7</div>
        <div>Line 8</div>
    </div>
</div>

</body>
</html>
