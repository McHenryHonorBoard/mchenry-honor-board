<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>McHenry Honor Board</title>

<style>
  body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    width: 100%;
  }

  .board-container {
    width: 100%;
    max-width: 1800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  .content-area {
    flex: 1;
    display: flex;
    padding: 0 20px;
    gap: 20px;
    box-sizing: border-box;
    margin-top: 10px;
    width: 100%;
  }

  .column {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  /* ⭐ Category title (fixed size) */
  .category-title {
    font-size: 36px;
    font-weight: 900;
    text-align: center;
    background: #b30000;
    padding: 14px 0;
    border-radius: 6px;
    color: white;
    box-shadow: 0 0 12px rgba(0,0,0,0.6);
    width: 100%;
  }

  /* ⭐ Scroll window */
  .scroll-box {
    position: absolute;
    top: 80px;
    bottom: 0;
    width: 100%;
    overflow: hidden;
  }

  .scroll-content {
    display: flex;
    flex-direction: column;
    width: 100%;
    position: relative;
    opacity: 0;
    --scroll-height: 2000px;
    --start-offset: 0px;
  }

  /* ⭐ Guaranteed 65/35 spacing using grid */
  .entry {
    display: grid;
    grid-template-columns: 65% 35%;
    padding: 0.4vw 1vw;
    font-size: 2.2vw;
    align-items: center;
  }

  .entry-name {
    text-align: left;
  }

  .entry-score {
    text-align: right;
    white-space: nowrap;
  }

  .separator {
    font-size: 1.8vw;
    text-align: center;
    opacity: 0.6;
    margin: 1vw 0;
  }

  @keyframes scroll-up {
    from { transform: translateY(var(--start-offset)); }
    to   { transform: translateY(calc(-1 * var(--scroll-height))); }
  }

  /* ⭐ CELEBRATION MODE BANNER (Option C) */
  @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap');

  .footer-banner {
    background: linear-gradient(to bottom, #ffffff, #e8e8e8);
    color: black;
    text-align: center;
    font-family: 'Montserrat', sans-serif;
    font-size: 34px;
    font-weight: 900;
    padding: 20px 0;
    border-top: 8px solid #b30000;
    letter-spacing: 2px;
    text-transform: uppercase;
    box-shadow: 0 -4px 14px rgba(0,0,0,0.45);

    /* ⭐ Celebration animation */
    animation: celebrate 2.5s ease-in-out infinite;
  }

  @keyframes celebrate {
    0% {
      text-shadow: 0 0 8px #fff;
      color: black;
    }
    50% {
      text-shadow: 0 0 18px #ff0000;
      color: #b30000;
    }
    100% {
      text-shadow: 0 0 8px #fff;
      color: black;
    }
  }
</style>
</head>

<body>

<div class="board-container">

  <div class="content-area">

    <!-- 300 Games -->
    <div class="column">
      <div class="category-title">300 Games</div>
      <div class="scroll-box">
        <div class="scroll-content" id="scroll-300">
          <div id="cat-300"></div>
          <div id="cat-300-dup"></div>
        </div>
      </div>
    </div>

    <!-- 800 Series -->
    <div class="column">
      <div class="category-title">800 Series</div>
      <div class="scroll-box">
        <div class="scroll-content" id="scroll-800">
          <div id="cat-800"></div>
          <div id="cat-800-dup"></div>
        </div>
      </div>
    </div>

  </div>

  <div class="footer-banner">
    McHenry Bowl Honor Board — Est. 1959
  </div>

</div>

<script>
  const URL_300 = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT0YrweqDspeSwxTSzqDFQB_MxwTMkx-tdFzzuoOUv89OS3Hb4Je6jyxNuXM_6lcIOCmRRGgp91VlF8/pub?gid=0&single=true&output=csv";
  const URL_800 = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT0YrweqDspeSwxTSzqDFQB_MxwTMkx-tdFzzuoOUv89OS3Hb4Je6jyxNuXM_6lcIOCmRRGgp91VlF8/pub?gid=288383571&single=true&output=csv";

  function parseCsv(text) {
    return text.trim().split(/\r?\n/).map(line => line.split(/\t|,/));
  }

  async function fetchCsv(url) {
    const res = await fetch(url);
    return parseCsv(await res.text());
  }

  function addBlankLines(container, count = 30) {
    for (let i = 0; i < count; i++) {
      const div = document.createElement("div");
      div.className = "entry";
      div.innerHTML = "&nbsp;";
      container.appendChild(div);
    }
  }

  function addSeparator(container) {
    const sep = document.createElement("div");
    sep.className = "separator";
    sep.textContent = "------------------------------";
    container.appendChild(sep);
  }

  function renderList(rows, container, formatter) {
    const header = rows[0];
    const data = rows.slice(1);

    container.innerHTML = "";

    data.forEach(r => {
      const div = document.createElement("div");
      div.className = "entry";
      div.innerHTML = formatter(r, header);
      container.appendChild(div);
    });

    addBlankLines(container);
    addSeparator(container);
  }

  /* ⭐ Mid-screen start + no flicker + speed fix */
  function startScroll(id, basePixelsPerSecond) {
    const content = document.getElementById(id);
    const scrollBox = content.parentElement;

    setTimeout(() => {
      const height = content.scrollHeight;
      const windowHeight = scrollBox.clientHeight;

      const startOffset = windowHeight / 2;

      content.style.setProperty('--scroll-height', `${height}px`);
      content.style.setProperty('--start-offset', `${startOffset}px`);

      const pcHeight = 900;
      const deviceHeight = window.innerHeight;
      const scale = pcHeight / deviceHeight;

      const duration = height / (basePixelsPerSecond * scale);

      content.style.animation = `scroll-up ${duration}s linear infinite`;

      content.style.opacity = 1;

    }, 250);
  }

  window.addEventListener("load", async () => {
    const [rows300, rows800] = await Promise.all([
      fetchCsv(URL_300),
      fetchCsv(URL_800)
    ]);

    const c300 = document.getElementById("cat-300");
    const c800 = document.getElementById("cat-800");

    renderList(rows300, c300, (r,h)=>{
      const first = r[h.indexOf("FirstName")];
      const last  = r[h.indexOf("LastName")];
      const count = Number(r[h.indexOf("Count")]);
      return `
        <span class="entry-name">${first} ${last}</span>
        <span class="entry-score">${count > 1 ? "(" + count + ")" : ""}</span>
      `;
    });

    renderList(rows800, c800, (r,h)=>{
      return `
        <span class="entry-name">${r[h.indexOf("FirstName")]} ${r[h.indexOf("LastName")]}</span>
        <span class="entry-score">${r[h.indexOf("Score")]}</span>
      `;
    });

    requestAnimationFrame(() => {
      document.getElementById("cat-300-dup").innerHTML = c300.innerHTML;
      document.getElementById("cat-800-dup").innerHTML = c800.innerHTML;
    });

    /* ⭐ SPEED = 32 */
    const SPEED = 32;

    startScroll("scroll-300", SPEED);
    startScroll("scroll-800", SPEED);
  });
</script>

</body>
</html>
