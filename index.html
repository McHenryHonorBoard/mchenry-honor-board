<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>McHenry Honor Board</title>

<style>
    body {
        background: black;
        color: white;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
    }

    .board-title {
        text-align: center;
        font-size: 48px;
        font-weight: bold;
        margin-bottom: 40px;
        color: #00ff99;
    }

    /* 4 equal columns */
    .row {
        display: flex;
        justify-content: space-between;
        gap: 20px;
    }

    .category {
        width: 25%;
    }

    .category-header {
        background: #b30000;
        color: white;
        font-size: 32px;
        font-weight: bold;
        padding: 10px;
        text-align: center;
        border-radius: 6px;
    }

    .scroll-window {
        height: 650px; /* adjust for your TV */
        overflow: hidden;
        margin-top: 10px;
        border: 2px solid #00ff99;
        border-radius: 6px;
        position: relative;
    }

    .scroll-content {
        display: flex;
        flex-direction: column;
        animation: scrollUp 80s linear infinite; /* slower scroll */
    }

    .name {
        font-size: 26px;
        padding: 6px 0;
        text-align: center;
    }

    /* 10-line gap */
    .gap {
        height: calc(10 * 32px);
    }

    @keyframes scrollUp {
        0% { transform: translateY(0); }
        100% { transform: translateY(-100%); }
    }
</style>
</head>

<body>

<div class="board-title">McHenry Honor Board</div>

<div class="row" id="categories"></div>

<script>
/* ===========================
   LIVE GOOGLE SHEETS CSV URLS
   =========================== */
const categories = [
    {
        title: "300 Games",
        url: "https://docs.google.com/spreadsheets/d/11RQsz_ZIbPKCf2K0L93yPCkMg4jx-zteVoGrJ-UAIKA/export?format=csv&gid=0"
    },
    {
        title: "11 in a Row",
        url: "https://docs.google.com/spreadsheets/d/11RQsz_ZIbPKCf2K0L93yPCkMg4jx-zteVoGrJ-UAIKA/export?format=csv&gid=1645007257"
    },
    {
        title: "800 Series",
        url: "https://docs.google.com/spreadsheets/d/11RQsz_ZIbPKCf2K0L93yPCkMg4jx-zteVoGrJ-UAIKA/export?format=csv&gid=288383571"
    },
    {
        title: "1100 Series",
        url: "https://docs.google.com/spreadsheets/d/11RQsz_ZIbPKCf2K0L93yPCkMg4jx-zteVoGrJ-UAIKA/export?format=csv&gid=1815197466"
    }
];

/* ===========================
   BUILD 4 COLUMNS + LOAD DATA
   =========================== */
const container = document.getElementById("categories");

categories.forEach(cat => {
    const section = document.createElement("div");
    section.className = "category";

    section.innerHTML = `
        <div class="category-header">${cat.title}</div>
        <div class="scroll-window">
            <div class="scroll-content" id="${cat.title.replace(/\s+/g, '')}">
                <div class="gap"></div>
            </div>
        </div>
    `;

    container.appendChild(section);

    fetch(cat.url)
        .then(res => res.text())
        .then(csv => {
            const lines = csv.trim().split("\n");
            const contentDiv = document.getElementById(cat.title.replace(/\s+/g, ''));

            lines.forEach(line => {
                const name = document.createElement("div");
                name.className = "name";
                name.textContent = line.trim();
                contentDiv.insertBefore(name, contentDiv.querySelector(".gap"));
            });
        })
        .catch(err => console.error("Error loading CSV for", cat.title, err));
});
</script>

</body>
</html>
