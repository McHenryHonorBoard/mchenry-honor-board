<style>
  body {
    margin: 0;
    background: black;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }

  .board-container {
    width: 100%;
    max-width: 1280px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  /* REMOVE TOP LOGO — no header */

  .content-area {
    flex: 1;
    display: flex;
    padding: 0 20px;
    gap: 20px;
    box-sizing: border-box;
    margin-top: 10px;
  }

  .column {
    width: 50%;
    position: relative;
    overflow: hidden;
  }

  .category-title {
    font-size: 36px;
    font-weight: bold;
    text-align: center;
    background: #b30000;
    padding: 14px 0;
    border-radius: 6px;
    color: white;
    box-shadow: 0 0 12px rgba(0,0,0,0.6);
    width: 100%;
  }

  .scroll-box {
    position: absolute;
    top: 80px;
    bottom: 0;
    width: 100%;
    overflow: hidden;
  }

  /* NEW BOTTOM BANNER */
  .footer-banner {
    background: white;
    color: black;
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    padding: 12px 0;
    border-top: 4px solid #b30000;
  }
</style>

<body>

<div class="board-container">

  <!-- MAIN CONTENT -->
  <div class="content-area">

    <!-- 300 Games -->
    <div class="column">
      <div class="category-title">300 Games</div>
      <div class="scroll-box">
        <div class="scroll-content" id="scroll-300">
          <div id="cat-300"></div>
          <div id="cat-300-dup"></div>
        </div>
      </div>
    </div>

    <!-- 800 Series -->
    <div class="column">
      <div class="category-title">800 Series</div>
      <div class="scroll-box">
        <div class="scroll-content" id="scroll-800">
          <div id="cat-800"></div>
          <div id="cat-800-dup"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- NEW BOTTOM BANNER -->
  <div class="footer-banner">
    McHenry Bowl Honor Board — Est. 1959
  </div>

</div>
